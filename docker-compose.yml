services:
  libretranslate:
    image: libretranslate/libretranslate:latest
    ports:
      - "5050:5000"
    volumes:
      - lt-data:/home/libretranslate/.local:rw
    tty: true
    healthcheck:
      test: [ 'CMD-SHELL', './venv/bin/python scripts/healthcheck.py' ]
      interval: 10s
      timeout: 4s
      retries: 4
      start_period: 5s
    environment:
      LT_LOAD_ONLY: "en,es,de,fr,uk,ru,ja,zh,ru"
      LT_DISABLE_WEB_UI: "false"
      LT_API_KEYS: "false"
      LT_SUGGESTIONS: "false"
      LT_UPDATE_MODELS: "true"
    restart: unless-stopped

volumes:
  lt-data:
