name: Linux Electron runtime deps
description: >-
  Install xvfb and the shared libraries Electron and uiohook-napi (libXtst)
  need to launch on an Ubuntu runner.

runs:
  using: composite
  steps:
    - name: Install Electron runtime deps
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          xvfb \
          libnss3 \
          libatk1.0-0t64 \
          libatk-bridge2.0-0t64 \
          libcups2t64 \
          libdrm2 \
          libxkbcommon0 \
          libxcomposite1 \
          libxdamage1 \
          libxrandr2 \
          libgbm1 \
          libasound2t64 \
          libpangocairo-1.0-0 \
          libpango-1.0-0 \
          libxtst6
