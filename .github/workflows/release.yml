name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-guard:
    name: Tag matches package.json version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare tag with package.json version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          expected="v$(jq -r .version package.json)"
          if [ "${TAG_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${TAG_NAME} does not match package.json version (${expected})"
            exit 1
          fi
          echo "Tag ${TAG_NAME} matches package.json"

  checks:
    name: Checks
    needs: version-guard
    uses: ./.github/workflows/checks.yml

  package:
    name: Package
    needs: checks
    uses: ./.github/workflows/package.yml
    with:
      cache-dependencies: false

  publish:
    name: Publish draft pre-release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! is_draft="$(gh release view "${TAG_NAME}" --json isDraft --jq .isDraft 2>&1)"; then
            if [[ "${is_draft}" == *"release not found"* ]]; then
              echo "No release for ${TAG_NAME} yet"
              exit 0
            fi
            echo "::error::Could not look up release ${TAG_NAME}: ${is_draft}"
            exit 1
          fi
          if [ "${is_draft}" != "true" ]; then
            echo "::error::Release ${TAG_NAME} is already published; refusing to modify it"
            exit 1
          fi
          echo "Release ${TAG_NAME} exists as a draft; updating it"

      - name: Download installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Check installer set and write SHA256SUMS.txt
        working-directory: release-assets
        env:
          EXPECTED_INSTALLERS: 6
        run: |
          shopt -s nullglob
          installers=(*.dmg *.exe *.zip *.AppImage *.deb)
          if [ "${#installers[@]}" -ne "${EXPECTED_INSTALLERS}" ]; then
            echo "::error::Expected ${EXPECTED_INSTALLERS} installers, found ${#installers[@]}: ${installers[*]}"
            exit 1
          fi
          sha256sum -- "${installers[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt

      - name: Create draft GitHub pre-release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: OpenTranslate Desktop ${{ github.ref_name }}
          draft: true
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
